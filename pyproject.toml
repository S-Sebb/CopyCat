[project]
name = "copycat"
version = "0.1.0"
description = "Read and restore MIFARE Classic card memory with an ACR122U"
readme = "README.md"
authors = [
    { name = "S-Sebb", email = "a794194678@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyscard>=2.3.1",
]

[project.scripts]
copycat = "copycat.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
